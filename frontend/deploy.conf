limit_req_zone $binary_remote_addr zone=evolix_auth:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=evolix_api:10m rate=30r/s;
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 6m;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Cross-Origin-Opener-Policy same-origin-allow-popups always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; img-src 'self' data: blob: https://*.googleusercontent.com; font-src 'self'; connect-src 'self' https://accounts.google.com; frame-src 'self' https://accounts.google.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  location ~ ^/api/v1/(platform/)?auth/ {
    limit_req zone=evolix_auth burst=20 nodelay;
    limit_req_status 429;
    proxy_pass http://api:8010;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 30s;
  }
  location /api/v1/ {
    limit_req zone=evolix_api burst=80 nodelay;
    limit_req_status 429;
    proxy_pass http://api:8010;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 30s;
  }
  location / { try_files $uri $uri/ /index.html; }
}
